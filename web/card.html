<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#252525;--muted:#777;--line:#e5e5e5;--soft:#f6f6f6;--active:#edfaf3;--accent:#147d4b;--shadow:0 8px 32px #00000008;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#202020;--fg:#ececec;--muted:#a2a2a2;--line:#3d3d3d;--soft:#2b2b2b;--active:#193c2c;--accent:#66d59c;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg)}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:default;opacity:.5}
.card{max-width:760px;margin:0 auto;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:var(--shadow)}.eyebrow{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:14px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}h1{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.2px;margin:0 0 8px}.description{color:var(--muted);margin:0 0 18px;white-space:pre-wrap}.option{display:flex;width:100%;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:9px 0;transition:background .15s,border-color .15s}.option:hover{background:var(--soft)}.option[aria-checked=true]{border-color:var(--accent);background:var(--active)}.indicator{flex:none;width:18px;height:18px;border:1px solid #aaa;border-radius:50%;margin-top:3px;display:grid;place-items:center;font-size:12px}.multi .indicator{border-radius:5px}.option[aria-checked=true] .indicator{background:var(--accent);color:var(--bg);border-color:var(--accent)}.option-main{flex:1;min-width:0}.label{font-weight:550}.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px}.badge{font-size:11px;color:var(--accent);background:var(--active);border-radius:5px;padding:2px 6px;margin-left:8px;white-space:nowrap}
.image-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.image-grid .option{padding:0;overflow:hidden;display:block;margin:0}.image-grid img{display:block;width:100%;height:150px;object-fit:cover;background:var(--soft)}.image-grid .image-label{display:flex;gap:10px;padding:12px}.image-grid .indicator{flex:none}.rating{display:flex;gap:9px;margin:20px 0 8px;flex-wrap:wrap}.rating button{width:49px;height:49px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:18px}.rating button[aria-pressed=true]{background:var(--active);border-color:var(--accent);color:var(--accent)}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;max-width:282px}.rank-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);margin:8px 0}.rank-row[draggable=true]{cursor:grab}.rank-row.dragging{opacity:.5}.rank-row .number{color:var(--muted);width:20px}.rank-row .rank-label{flex:1}.rank-row button{border:none;background:var(--soft);border-radius:6px;width:29px;height:27px}.hint{font-size:12px;color:var(--muted);margin:8px 0}.note-label{display:block;font-size:12px;color:var(--muted);margin:18px 0 6px}textarea{display:block;width:100%;padding:11px 13px;resize:vertical;min-height:66px;background:var(--soft);color:var(--fg);border:1px solid transparent;border-radius:10px}.text-answer{min-height:120px}.actions{display:flex;align-items:center;gap:12px;margin-top:18px}.primary{border:0;border-radius:9px;padding:9px 20px;background:var(--fg);color:var(--bg);font-weight:550}.secondary{border:0;background:transparent;color:var(--muted);padding:9px 5px}.status{color:var(--muted);font-size:12px;flex:1;text-align:right}.error{color:#c04939;font-size:12px;white-space:pre-wrap;margin:10px 0 0}.summary{background:var(--active);border:1px solid var(--line);border-radius:12px;padding:15px;white-space:pre-wrap;margin-top:12px}.copy-area{margin-top:12px}.copy-area textarea{min-height:100px}.hidden{display:none!important}@media(max-width:480px){.card{padding:18px;border-radius:14px}.image-grid{grid-template-columns:1fr}.image-grid img{height:160px}.status{display:none}.rating button{width:43px;height:43px}}
</style></head><body><main id="app" class="card"><div class="eyebrow"><span class="dot"></span>问卷卡片</div><p class="description">正在加载问题…</p></main><script type="module">/* APP_SCRIPT */</script></body></html>
